<svg viewBox="0 0 440 180" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
  <defs>
    <linearGradient id="mSkyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="mSkyMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="mToneNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="mToneSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="55%" stop-color="#384c63"/>
      <stop offset="100%" stop-color="#4a5f77"/>
    </linearGradient>

    <linearGradient id="mToneSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#5a687d"/>
    </linearGradient>

    <linearGradient id="mToneGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#2b4c73"/>
      <stop offset="100%" stop-color="#3b5e87"/>
    </linearGradient>

    <linearGradient id="mSpireSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="mWinWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="mWinCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Distant Background Towers -->
  <g fill="url(#mSkyBg)">
    <rect x="10" y="80" width="35" height="100"/>
    <polygon points="26,80 27.5,60 29,80"/>
    <rect x="60" y="55" width="42" height="125"/>
    <rect x="120" y="35" width="48" height="145"/>
    <polygon points="142.5,35 144,12 145.5,35"/>
    <rect x="190" y="50" width="45" height="130"/>
    <rect x="255" y="30" width="48" height="150"/>
    <polygon points="277.5,30 279,8 280.5,30"/>
    <rect x="325" y="55" width="44" height="125"/>
    <rect x="385" y="70" width="45" height="110"/>
    <polygon points="406,70 407.5,50 409,70"/>
  </g>

  <!-- Midground Layer -->
  <g fill="url(#mSkyMid)">
    <rect x="0" y="100" width="32" height="80"/>
    <rect x="42" y="65" width="38" height="115"/>
    <polygon points="42,65 61,45 80,65"/>
    <rect x="100" y="50" width="40" height="130"/>
    <rect x="165" y="65" width="42" height="115"/>
    <rect x="235" y="45" width="40" height="135"/>
    <polygon points="235,45 255,25 275,45"/>
    <rect x="300" y="60" width="38" height="120"/>
    <rect x="355" y="85" width="38" height="95"/>
    <rect x="408" y="95" width="32" height="85"/>
  </g>

  <!-- Foreground Landmarks -->
  <g stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-linejoin="round">
    <!-- 1. One World Trade Obelisk (x=10) -->
    <g fill="url(#mToneGlass)">
      <polygon points="10,180 16,45 44,45 50,180"/>
      <rect x="25" y="38" width="10" height="7"/>
      <polygon points="29.3,38 30,10 30.7,38" fill="url(#mSpireSteel)"/>
      <circle cx="30" cy="10" r="1.5" fill="#ef4444" stroke="none"/>
    </g>

    <!-- 2. Woolworth Gothic Tower (x=60) -->
    <g fill="url(#mToneSteel)">
      <rect x="60" y="90" width="40" height="90"/>
      <rect x="67" y="65" width="26" height="25"/>
      <polygon points="67,65 80,45 93,65" fill="#475569"/>
      <line x1="80" y1="45" x2="80" y2="32" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- 3. CHRYSLER BUILDING (x=115) -->
    <g fill="url(#mToneNavy)">
      <rect x="115" y="85" width="50" height="95"/>
      <rect x="122" y="58" width="36" height="27"/>
      <rect x="128" y="38" width="24" height="20"/>
      <!-- Sunburst Terraces -->
      <path d="M 128 38 Q 140 27 152 38 Z" fill="#334155"/>
      <path d="M 130 30 Q 140 19 150 30 Z" fill="#475569"/>
      <path d="M 133 22 Q 140 12 147 22 Z" fill="#64748b"/>
      <!-- Needle Spire (Reaches y=6 cleanly) -->
      <polygon points="139.3,13 140,6 140.7,13" fill="url(#mSpireSteel)"/>
      <polygon points="122,58 118,56 122,60" fill="url(#mSpireSteel)"/>
      <polygon points="158,58 162,56 158,60" fill="url(#mSpireSteel)"/>
    </g>

    <!-- 4. Modern Glass Tower (x=175) -->
    <g fill="url(#mToneGlass)">
      <rect x="175" y="70" width="38" height="110"/>
      <polygon points="175,70 200,45 213,70"/>
    </g>

    <!-- 5. EMPIRE STATE BUILDING (HERO CENTER at x=220) -->
    <g fill="url(#mToneNavy)">
      <rect x="220" y="85" width="65" height="95"/>
      <rect x="226" y="60" width="53" height="25"/>
      <rect x="234" y="30" width="37" height="30"/>
      <rect x="240" y="13" width="25" height="17"/>
      <rect x="246" y="5" width="13" height="8" fill="#475569"/>
      <polygon points="252,5 252.5,2 253,5" fill="url(#mSpireSteel)"/>
      <circle cx="252.5" cy="2" r="1.5" fill="#ef4444" stroke="none"/>
    </g>

    <!-- 6. Rockefeller Center (x=295) -->
    <g fill="url(#mToneSteel)">
      <rect x="295" y="80" width="48" height="100"/>
      <rect x="302" y="58" width="34" height="22"/>
      <rect x="309" y="40" width="20" height="18"/>
    </g>

    <!-- 7. 432 Park Grid Tower (x=352) -->
    <g fill="url(#mToneGlass)">
      <rect x="352" y="35" width="34" height="145"/>
      <rect x="358" y="24" width="22" height="11" fill="#475569"/>
      <line x1="369" y1="24" x2="369" y2="12" stroke="#94a3b8" stroke-width="1.5"/>
    </g>

    <!-- 8. East High-Rise & Brownstones (x=395) -->
    <g fill="url(#mToneSlate)">
      <rect x="395" y="85" width="45" height="95"/>
      <rect x="405" y="62" width="25" height="23"/>
      <polygon points="405,62 417.5,45 430,62" fill="#475569"/>
    </g>
  </g>

  <!-- Mullions -->
  <g stroke="rgba(255,255,255,0.22)" stroke-width="1.2">
    <line x1="240" y1="30" x2="240" y2="180"/>
    <line x1="246" y1="30" x2="246" y2="180"/>
    <line x1="252" y1="30" x2="252" y2="180"/>
    <line x1="258" y1="30" x2="258" y2="180"/>
    <line x1="264" y1="30" x2="264" y2="180"/>
    <line x1="130" y1="58" x2="130" y2="180"/>
    <line x1="137" y1="58" x2="137" y2="180"/>
    <line x1="144" y1="58" x2="144" y2="180"/>
    <line x1="151" y1="58" x2="151" y2="180"/>
  </g>

  <!-- Windows Warm -->
  <g fill="url(#mWinWarm)">
    <!-- Empire State -->
    <rect x="238" y="95" width="2.5" height="4.5" rx="0.5"/>
    <rect x="247" y="95" width="2.5" height="4.5" rx="0.5"/>
    <rect x="256" y="95" width="2.5" height="4.5" rx="0.5"/>
    <rect x="238" y="115" width="2.5" height="4.5" rx="0.5"/>
    <rect x="247" y="115" width="2.5" height="4.5" rx="0.5"/>
    <rect x="256" y="115" width="2.5" height="4.5" rx="0.5"/>
    <rect x="238" y="135" width="2.5" height="4.5" rx="0.5"/>
    <rect x="247" y="135" width="2.5" height="4.5" rx="0.5"/>
    <rect x="256" y="135" width="2.5" height="4.5" rx="0.5"/>
    <!-- Chrysler -->
    <rect x="130" y="100" width="2.5" height="4.5" rx="0.5"/>
    <rect x="140" y="100" width="2.5" height="4.5" rx="0.5"/>
    <rect x="150" y="100" width="2.5" height="4.5" rx="0.5"/>
    <rect x="130" y="125" width="2.5" height="4.5" rx="0.5"/>
    <rect x="140" y="125" width="2.5" height="4.5" rx="0.5"/>
    <rect x="150" y="125" width="2.5" height="4.5" rx="0.5"/>
  </g>

  <!-- Baseline -->
  <line x1="0" y1="180" x2="440" y2="180" stroke="#334155" stroke-width="2.5"/>
</svg>