<svg viewBox="0 0 440 180" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
  <defs>
    <!-- Background Layer (Hazy Distant Skyline) -->
    <linearGradient id="mSkyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Midground Architectural Layer -->
    <linearGradient id="mSkyMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Foreground Architectural Tones -->
    <linearGradient id="mToneNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="mToneSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="55%" stop-color="#384c63"/>
      <stop offset="100%" stop-color="#4a5f77"/>
    </linearGradient>

    <linearGradient id="mToneSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#5a687d"/>
    </linearGradient>

    <linearGradient id="mToneGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#2b4c73"/>
      <stop offset="100%" stop-color="#3b5e87"/>
    </linearGradient>

    <linearGradient id="mToneCopper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3d36"/>
      <stop offset="50%" stop-color="#2d5a50"/>
      <stop offset="100%" stop-color="#3d786a"/>
    </linearGradient>

    <linearGradient id="mSpireSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="mWinWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="mWinCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- LAYER 1: Distant Background Skyline (Dense & Continuous, Zero Gaps) -->
  <g fill="url(#mSkyBg)">
    <rect x="0" y="110" width="440" height="70"/>
    <polygon points="0,180 0,95 30,85 30,180"/>
    <path d="M 32 180 L 32 78 Q 50 62 68 78 L 68 180 Z"/>
    <rect x="70" y="55" width="34" height="125"/>
    <polygon points="85.5,55 87,25 88.5,55"/>
    <polygon points="108,180 108,60 152,42 152,180"/>
    <rect x="154" y="68" width="38" height="112"/>
    <polygon points="171.5,68 173,32 174.5,68"/>
    <rect x="195" y="45" width="45" height="135"/>
    <rect x="208" y="30" width="20" height="15"/>
    <path d="M 245 180 L 245 62 Q 265 48 285 62 L 285 180 Z"/>
    <polygon points="290,180 290,48 335,70 335,180"/>
    <rect x="340" y="58" width="38" height="122"/>
    <polygon points="357.5,58 359,28 360.5,58"/>
    <rect x="382" y="70" width="58" height="110"/>
  </g>

  <!-- LAYER 2: Midground Architectural Layer (Continuous Dense Blocks, Zero Gaps) -->
  <g fill="url(#mSkyMid)">
    <!-- Continuous solid connecting base across whole horizon -->
    <rect x="0" y="125" width="440" height="55"/>
    <rect x="0" y="105" width="35" height="75"/>
    <rect x="15" y="88" width="28" height="92"/>
    <rect x="44" y="100" width="42" height="80"/>
    <rect x="52" y="78" width="26" height="25"/>
    <polygon points="64,78 65,55 66,78"/>
    <path d="M 88 180 L 88 72 Q 106 60 125 72 L 125 180 Z"/>
    <polygon points="128,180 128,82 170,58 170,180"/>
    <rect x="175" y="78" width="38" height="102"/>
    <rect x="183" y="52" width="22" height="26"/>
    <line x1="194" y1="52" x2="194" y2="32" stroke="#64748b" stroke-width="1.5"/>
    <rect x="218" y="90" width="44" height="90"/>
    <path d="M 222 90 Q 240 72 258 90 Z"/>
    <polygon points="265,180 265,62 312,88 312,180"/>
    <rect x="315" y="85" width="42" height="95"/>
    <rect x="323" y="65" width="26" height="22"/>
    <polygon points="335,65 336,45 337,65"/>
    <rect x="360" y="105" width="45" height="75"/>
    <rect x="390" y="88" width="8" height="22"/>
    <rect x="408" y="95" width="32" height="85"/>
  </g>

  <!-- LAYER 3: Foreground 9 Completely Unique Architectural Landmarks (Overlapping & Gapless) -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1.1" stroke-linejoin="round">

    <!-- 1. ONE WORLD TRADE CENTER / CHAMFERED OBELISK (x=0 to x=56) -->
    <g fill="url(#mToneGlass)">
      <polygon points="0,180 14,42 42,42 56,180"/>
      <line x1="28" y1="42" x2="0" y2="180" stroke="rgba(255,255,255,0.3)"/>
      <line x1="28" y1="42" x2="56" y2="180" stroke="rgba(255,255,255,0.18)"/>
      <rect x="23" y="35" width="10" height="7" fill="#334155"/>
      <polygon points="27.4,35 28,8 28.6,35" fill="url(#mSpireSteel)"/>
      <circle cx="28" cy="8" r="1.5" fill="#ef4444" stroke="none"/>
    </g>

    <!-- 2. THE GHERKIN / CURVED FOSTER GLASS DOME (x=48 to x=105, Overlaps #1 and #3) -->
    <g fill="url(#mToneSteel)">
      <path d="M 48 180 C 48 110, 64 50, 77 32 C 90 50, 105 110, 105 180 Z"/>
      <path d="M 71 48 Q 77 32 83 48 Z" fill="#1e293b"/>
      <path d="M 52 150 Q 77 130 102 110" stroke="rgba(255,255,255,0.3)" fill="none"/>
      <path d="M 102 150 Q 77 130 52 110" stroke="rgba(255,255,255,0.3)" fill="none"/>
      <path d="M 58 110 Q 77 90 96 70" stroke="rgba(255,255,255,0.3)" fill="none"/>
      <path d="M 96 110 Q 77 90 58 70" stroke="rgba(255,255,255,0.3)" fill="none"/>
    </g>

    <!-- 3. THE CHRYSLER BUILDING / ART DECO SUNBURST (x=98 to x=158, Overlaps #2 and #4) -->
    <g fill="url(#mToneNavy)">
      <rect x="98" y="90" width="60" height="90"/>
      <rect x="108" y="62" width="40" height="28"/>
      <path d="M 112 62 Q 128 48 144 62 Z" fill="#334155"/>
      <path d="M 115 52 Q 128 38 141 52 Z" fill="#475569"/>
      <path d="M 118 42 Q 128 28 138 42 Z" fill="#64748b"/>
      <path d="M 122 32 Q 128 19 134 32 Z" fill="#94a3b8"/>
      <polygon points="127.3,19 128,5 128.7,19" fill="url(#mSpireSteel)"/>
      <polygon points="108,62 103,59 108,65" fill="url(#mSpireSteel)"/>
      <polygon points="148,62 153,59 148,65" fill="url(#mSpireSteel)"/>
    </g>

    <!-- 4. SHANGHAI SWFC / BOTTLE OPENER (x=150 to x=208, Overlaps #3 and #5) -->
    <g fill="url(#mToneGlass)">
      <polygon points="150,180 162,26 196,26 208,180"/>
      <polygon points="170,36 188,36 185,56 173,56" fill="#03091e" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <line x1="170" y1="36" x2="188" y2="36" stroke="url(#mSpireSteel)" stroke-width="1.5"/>
    </g>

    <!-- 5. THE EMPIRE STATE BUILDING / HERO CENTERPIECE (x=202 to x=275, Overlaps #4 and #6) -->
    <g fill="url(#mToneNavy)">
      <rect x="202" y="92" width="73" height="88"/>
      <rect x="211" y="66" width="55" height="26"/>
      <rect x="220" y="38" width="37" height="28"/>
      <rect x="226" y="18" width="25" height="20"/>
      <rect x="232" y="8" width="13" height="10" fill="#475569"/>
      <polygon points="237.8,8 238.5,1 239.2,8" fill="url(#mSpireSteel)"/>
      <circle cx="238.5" cy="1.5" r="1.5" fill="#ef4444" stroke="none"/>
    </g>

    <!-- 6. MODERN JENGA TOWER / CANTILEVER CUBES (x=268 to x=325, Overlaps #5 and #7) -->
    <g fill="url(#mToneSteel)">
      <rect x="268" y="140" width="57" height="40"/>
      <rect x="272" y="115" width="46" height="25"/>
      <rect x="282" y="92" width="40" height="23"/>
      <rect x="274" y="70" width="44" height="22"/>
      <rect x="282" y="48" width="32" height="22"/>
      <rect x="288" y="32" width="20" height="16" fill="#384c63"/>
      <line x1="298" y1="32" x2="298" y2="20" stroke="#94a3b8" stroke-width="1.3"/>
    </g>

    <!-- 7. BANK OF CHINA TOWER / GEOMETRIC X-BRACES (x=318 to x=370, Overlaps #6 and #8) -->
    <g fill="url(#mToneGlass)">
      <polygon points="318,180 318,80 344,50 370,80 370,180"/>
      <polygon points="332,50 344,24 356,50" fill="#2b4c73"/>
      <polygon points="343.4,24 344,7 344.6,24" fill="url(#mSpireSteel)"/>
      <line x1="318" y1="180" x2="370" y2="130" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
      <line x1="370" y1="180" x2="318" y2="130" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
      <line x1="318" y1="130" x2="370" y2="80" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
      <line x1="370" y1="130" x2="318" y2="80" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
    </g>

    <!-- 8. TRANSAMERICA PYRAMID (x=364 to x=412, Overlaps #7 and #9) -->
    <g fill="url(#mToneSlate)">
      <polygon points="364,180 388,25 412,180"/>
      <rect x="377" y="75" width="4" height="40" fill="#3b4859"/>
      <rect x="396" y="75" width="4" height="40" fill="#3b4859"/>
      <polygon points="387.4,25 388,10 388.6,25" fill="url(#mSpireSteel)"/>
      <circle cx="388" cy="10" r="1.2" fill="#ef4444" stroke="none"/>
    </g>

    <!-- 9. HISTORIC BROWNSTONE ROW & WATER TANK (x=406 to x=440, Overlaps #8 to edge) -->
    <g fill="url(#mToneCopper)">
      <rect x="406" y="105" width="34" height="75"/>
      <rect x="404" y="101" width="36" height="4" fill="#2d5a50"/>
      <path d="M 412 116 Q 415 112 418 116 L 418 124 L 412 124 Z" fill="#fef08a" opacity="0.8"/>
      <path d="M 426 116 Q 429 112 432 116 L 432 124 L 426 124 Z" fill="#fef08a" opacity="0.8"/>
      <path d="M 412 134 Q 415 130 418 134 L 418 142 L 412 142 Z" fill="#fef08a" opacity="0.8"/>
      <path d="M 426 134 Q 429 130 432 134 L 432 142 L 426 142 Z" fill="#fef08a" opacity="0.8"/>
      <!-- Rooftop Water Tank on Stilts -->
      <line x1="416" y1="101" x2="418" y2="86" stroke="#475569" stroke-width="1.2"/>
      <line x1="426" y1="101" x2="424" y2="86" stroke="#475569" stroke-width="1.2"/>
      <rect x="415" y="74" width="12" height="12" rx="1" fill="#4a5568"/>
      <polygon points="413,74 421,66 429,74" fill="#334155"/>
    </g>

  </g>

  <!-- Vertical Mullions -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1">
    <line x1="226" y1="38" x2="226" y2="180"/>
    <line x1="232" y1="38" x2="232" y2="180"/>
    <line x1="238.5" y1="38" x2="238.5" y2="180"/>
    <line x1="245" y1="38" x2="245" y2="180"/>
    <line x1="251" y1="38" x2="251" y2="180"/>
    <line x1="179" y1="56" x2="179" y2="180" stroke="rgba(255,255,255,0.25)"/>
  </g>

  <!-- Warm Illuminated Windows -->
  <g fill="url(#mWinWarm)">
    <!-- Empire State -->
    <rect x="228" y="98" width="2.5" height="4.5" rx="0.5"/>
    <rect x="237" y="98" width="2.5" height="4.5" rx="0.5"/>
    <rect x="246" y="98" width="2.5" height="4.5" rx="0.5"/>
    <rect x="228" y="116" width="2.5" height="4.5" rx="0.5"/>
    <rect x="237" y="116" width="2.5" height="4.5" rx="0.5"/>
    <rect x="246" y="116" width="2.5" height="4.5" rx="0.5"/>
    <rect x="228" y="134" width="2.5" height="4.5" rx="0.5"/>
    <rect x="237" y="134" width="2.5" height="4.5" rx="0.5"/>
    <rect x="246" y="134" width="2.5" height="4.5" rx="0.5"/>
    <!-- Chrysler -->
    <rect x="119" y="104" width="2.5" height="4" rx="0.5"/>
    <rect x="127" y="104" width="2.5" height="4" rx="0.5"/>
    <rect x="135" y="104" width="2.5" height="4" rx="0.5"/>
    <rect x="119" y="124" width="2.5" height="4" rx="0.5"/>
    <rect x="127" y="124" width="2.5" height="4" rx="0.5"/>
    <rect x="135" y="124" width="2.5" height="4" rx="0.5"/>
    <!-- Jenga Penthouse -->
    <rect x="278" y="74" width="4" height="3" rx="0.5"/>
    <rect x="290" y="96" width="4" height="3" rx="0.5"/>
    <rect x="282" y="119" width="4" height="3" rx="0.5"/>
  </g>

  <!-- Cool Cyan Reflections -->
  <g fill="url(#mWinCyan)">
    <rect x="25" y="60" width="6" height="3" rx="0.5"/>
    <rect x="25" y="80" width="6" height="3" rx="0.5"/>
    <rect x="25" y="100" width="6" height="3" rx="0.5"/>
  </g>

  <!-- Ground Baseline -->
  <line x1="0" y1="180" x2="440" y2="180" stroke="#334155" stroke-width="2.5"/>
</svg>
